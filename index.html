const RZ_EACH=false;
const MET=[["整備結果説明","m1"],["下見せ","m2"],["タイヤチェック","m3"]];
const $=s=>document.querySelector(s);
const sum=(a,i)=>a.reduce((t,r)=>t+r[i],0);
const CG='<colgroup><col style="width:34%"><col style="width:22%"><col style="width:22%"><col style="width:22%"></colgroup>';

function card(s){
  const tag=(s.none?'<b class="nores">実績なし</b>':"")+(s.note?`<em>${s.note}</em>`:"");
  const tot=[1,2,3].map(i=>sum(s.p,i));
  const rows=s.p.map(r=>{const z=r[1]+r[2]+r[3]===0;
    return `<tr><td>${r[0]}</td>`+[1,2,3].map(i=>`<td class="${r[i]?"":(z||RZ_EACH)?"rz":"z"}">${r[i]}</td>`).join("")+"</tr>"}).join("");
  return `<section class="card"><div class="ch"><h2>${s.n}</h2><span>${tag}${s.p.length}名</span></div>
  <table>${CG}<thead><tr><th></th><th class="m1">整備結果<br>説明</th><th class="m2">下見せ</th><th class="m3">タイヤ<br>チェック</th></tr></thead><tbody>${rows}</tbody></table>
  <table class="ft">${CG}<tbody><tr><td>店舗計</td>${tot.map(v=>`<td>${v}</td>`).join("")}</tr></tbody></table></section>`;
}

function show(i){
  const v=D[i], all=v.s.flatMap(s=>s.p);
  const maxRows=Math.max(1,...v.s.map(s=>s.p.length));
  const rh=38;
  $("#stage").style.setProperty("--rh",rh+"px");
  $("#stage").style.setProperty("--k",rh<34?"0.8":"1");
  document.querySelectorAll("#months button").forEach((b,k)=>b.setAttribute("aria-pressed",k===i));
  $("#sub").textContent=v.sub;
  $("#sum").innerHTML=MET.map(([n,c],k)=>`<div class="${c}"><b>${sum(all,k+1)}</b><span>${n}</span></div>`).join("");
  $("#r1").innerHTML=v.s.slice(0,3).map(card).join("");
  $("#r2").innerHTML=v.s.slice(3).map(card).join("");
}

$("#months").innerHTML=D.map(v=>`<button type="button" class="${v.k==="h"?"tot":""}${v.g?" gap":""}" aria-pressed="false">${v.l}</button>`).join("");
document.querySelectorAll("#months button").forEach((b,i)=>b.addEventListener("click",()=>show(i)));
document.addEventListener("keydown",e=>{
  const cur=[...document.querySelectorAll("#months button")].findIndex(b=>b.getAttribute("aria-pressed")==="true");
  if(e.key==="ArrowLeft"&&cur>0)show(cur-1);
  if(e.key==="ArrowRight"&&cur<D.length-1)show(cur+1);
});

function fit(){
  $("#stage").style.zoom=innerWidth/1920;
}
addEventListener("resize",fit);fit();
show(D.map(v=>v.k).lastIndexOf("m"));
